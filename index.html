/* ══════════════════════════════════════
   MULTIPLAYER — CREATE TABLE
══════════════════════════════════════ */
function CreateTable({onStart,onCancel}){
  const[step,setStep]=useState(1);
  const[gameType,setGameType]=useState('kachuful');
  const[numP,setNumP]=useState(4);
  const[numD,setNumD]=useState(1);
  const[hostName,setHostName]=useState('');
  const[code]=useState(()=>genCode());
  const[players,setPlayers]=useState([{seat:0,name:'Host',status:'host'}]);
  const[peerSt,setPeerSt]=useState('connecting');
  const[copied,setCopied]=useState(false);
  const pRef=useRef(null);
  const connsRef=useRef({});
  const playersRef=useRef(players);
  useEffect(()=>{playersRef.current=players;},[players]);

  useEffect(()=>{
    if(step!==2)return;
    const peer=new Peer(`cardroom-${code}`,{debug:0});
    pRef.current=peer;
    peer.on('open',()=>setPeerSt('ready'));
    peer.on('error',e=>{setPeerSt('error');console.warn(e.type);});
    peer.on('connection',conn=>{
      conn.on('open',()=>{
        conn.on('data',msg=>{
          if(msg.type==='join'){
            const cur=playersRef.current;
            const taken=new Set(cur.map(p=>p.seat));
            let seat=1;while(taken.has(seat)&&seat<numP)seat++;
            if(seat>=numP){try{conn.send({type:'rejected',reason:'Table is full'});}catch(e){}return;}
            connsRef.current[seat]=conn;
            const nm=msg.name?.trim()||`Player ${seat+1}`;
            setPlayers(prev=>{
              const np=[...prev,{seat,name:nm,status:'joined',conn}];
              playersRef.current=np;
              const lob={type:'lobby',players:np.map(p=>({seat:p.seat,name:p.name,status:p.status}))};
              Object.values(connsRef.current).forEach(c=>{try{if(c?.open)c.send(lob);}catch(e){}});
              return np;
            });
            try{conn.send({type:'assigned',seat,code,gameType,numDecks:numD});}catch(e){}
          }
        });
        conn.on('close',()=>setPlayers(prev=>{
          const found=prev.find(p=>connsRef.current[p.seat]===conn);
          if(found)delete connsRef.current[found.seat];
          return prev.filter(p=>connsRef.current[p.seat]!==conn||p.seat===0);
        }));
      });
    });
    return()=>{try{peer.destroy();}catch(e){}};
  },[step,code,numP,gameType,numD]);

  const copyCode=()=>{try{navigator.clipboard.writeText(code);}catch(e){}setCopied(true);setTimeout(()=>setCopied(false),2000);};

  const doStart=()=>{
    if(!hostName.trim())return;
    const final=[{seat:0,name:hostName.trim(),status:'host'}];
    for(let s=1;s<numP;s++){
      const p=players.find(x=>x.seat===s);
      final.push(p?{...p}:{seat:s,name:BOT_NAMES[s-1],status:'bot'});
    }
    const pNames=final.map(p=>p.name);
    Object.entries(connsRef.current).forEach(([s,c])=>{
      try{if(c?.open)c.send({type:'game_start',gameType,playerNames:pNames,mySeat:parseInt(s),numDecks:numD});}catch(e){}
    });
    onStart({gameType,numPlayers:numP,numDecks:numD,players:final,code,connsRef,peerRef:pRef,isHost:true,myName:hostName.trim(),mySeat:0,playerNames:pNames});
  };

  const deckInfo=[
    {n:1,ico:'🃏',lbl:'1 Deck',sub:'52 cards'},
    {n:2,ico:'🃏🃏',lbl:'2 Decks',sub:'104 cards'},
    {n:3,ico:'🃏🃏🃏',lbl:'3 Decks',sub:'156 cards'},
  ];

  if(step===1)return(
    <div className="mbg" onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
      <div className="modal">
        <div className="mtit">CREATE TABLE</div>
        <div className="msub">Set up your private game room</div>
        <div className="field"><label>Your Name</label>
          <input className="finp" placeholder="Enter your name…" value={hostName} onChange={e=>setHostName(e.target.value)} maxLength={20} autoFocus/>
        </div>
        <div className="field"><label>Game</label>
          <select className="fsel" value={gameType} onChange={e=>setGameType(e.target.value)}>
            <option value="kachuful">Kachuful (Oh Hell)</option>
            <option value="napoleon">Napoleon (Ghar Ma Nathi)</option>
          </select>
        </div>
        <div className="field">
          <label>Players <span style={{color:'rgba(244,239,229,.35)',fontFamily:'Crimson Pro',letterSpacing:0,textTransform:'none',fontSize:11}}>(2–10)</span></label>
          <div className="selrow">
            {[2,3,4,5,6,7,8,9,10].map(n=>(
              <button key={n} type="button" className={`sel-btn${numP===n?' on':''}`} onClick={()=>setNumP(n)}>{n}</button>
            ))}
          </div>
          <div style={{fontSize:11,color:'rgba(244,239,229,.28)',marginTop:5}}>Empty seats auto-filled by bots</div>
        </div>
        <div className="field">
          <label>Card Decks</label>
          <div className="deck-row">
            {deckInfo.map(d=>(
              <div key={d.n} className={`deck-btn${numD===d.n?' on':''}`} onClick={()=>setNumD(d.n)}>
                <div className="deck-ico">{d.ico}</div>
                <div className="deck-lbl">{d.lbl}</div>
                <div className="deck-sub">{d.sub}</div>
              </div>
            ))}
          </div>
          {gameType==='kachuful'&&<div style={{fontSize:11,color:'rgba(244,239,229,.28)',marginTop:5}}>
            Max rounds: {maxRounds(numP,numD)} · {numD*52} cards ÷ {numP} players
          </div>}
          {gameType==='napoleon'&&<div style={{fontSize:11,color:'rgba(244,239,229,.28)',marginTop:5}}>
            Need {4*numD} cards per rank to complete a set · 13 total sets
          </div>}
        </div>
        <button className="mbtn" disabled={!hostName.trim()} onClick={()=>setStep(2)}>Create Room →</button>
        <button className="mbtn sec" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );

  return(
    <div className="mbg">
      <div className="modal">
        <div className="mtit">WAITING ROOM</div>
        <div className="msub">{gameType==='kachuful'?'Kachuful':'Napoleon'} · {numP} Players · {numD} Deck{numD>1?'s':''}</div>
        <div className={`sbar ${peerSt==='ready'?'ok':peerSt==='error'?'err':'pend'}`}>
          <div className={`dot ${peerSt==='ready'?'g':peerSt==='error'?'a':'r'}`}/>
          {peerSt==='ready'?'Room live — share the code below':peerSt==='error'?'Connection failed':'Connecting…'}
        </div>
        <div className="codebox">
          <div className="code-lbl">Room Code</div>
          <div className="code-val">{code}</div>
          <div className="code-hint">Anyone on any network can join</div>
          <button className="copy-btn" onClick={copyCode}>{copied?'✓ Copied!':'Copy Code'}</button>
        </div>
        <div style={{fontSize:9.5,color:'rgba(244,239,229,.32)',letterSpacing:1,marginBottom:7,textTransform:'uppercase'}}>
          Players ({players.length}/{numP})
        </div>
        <div className="slots-wrap">
          {Array.from({length:numP},(_,i)=>{
            const p=players.find(x=>x.seat===i);
            if(p)return(
              <div key={i} className={`pslot ${p.status==='host'||p.status==='joined'?'filled':'bot'}`}>
                <span className="slot-ava">{p.status==='bot'?BOT_AVA[i-1]:PAVA}</span>
                <span className="slot-nm">{p.seat===0?hostName||'You (Host)':p.name}</span>
                <span className={`slot-tag ${p.status}`}>{p.status==='host'?'HOST':p.status==='joined'?'JOINED':'BOT'}</span>
              </div>
            );
            return(
              <div key={i} className="pslot empty">
                <span className="slot-ava" style={{opacity:.28}}>👤</span>
                <span className="slot-nm" style={{color:'rgba(244,239,229,.28)',fontStyle:'italic'}}>Waiting…</span>
                <span className="slot-tag waiting">OPEN</span>
              </div>
            );
          })}
        </div>
        <div className="field"><label>Your Name (confirm)</label>
          <input className="finp" value={hostName} onChange={e=>setHostName(e.target.value)} maxLength={20}/>
        </div>
        <button className="mbtn" onClick={doStart} disabled={!hostName.trim()}>Start Game →</button>
        <button className="mbtn sec" onClick={onCancel}>← Back</button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   MULTIPLAYER — JOIN TABLE
══════════════════════════════════════ */
function JoinTable({onJoined,onCancel}){
  const[name,setName]=useState('');
  const[code,setCode]=useState('');
  const[st,setSt]=useState('idle');
  const[err,setErr]=useState('');
  const[seat,setSeat]=useState(null);
  const[lobby,setLobby]=useState([]);
  const pRef=useRef(null);
  const connRef=useRef(null);
  const seatRef=useRef(null);

  const doJoin=()=>{
    if(!name.trim()||code.trim().length<4){setErr('Enter your name and room code.');return;}
    setSt('connecting');setErr('');
    const peer=new Peer(undefined,{debug:0});
    pRef.current=peer;
    peer.on('open',()=>{
      const conn=peer.connect(`cardroom-${code.trim().toUpperCase()}`,{reliable:true});
      connRef.current=conn;
      const timeout=setTimeout(()=>{setSt('error');setErr('Could not reach room. Check code.');try{peer.destroy();}catch(e){}},9000);
      conn.on('open',()=>{clearTimeout(timeout);try{conn.send({type:'join',name:name.trim()});}catch(e){};});
      conn.on('data',msg=>{
        if(msg.type==='assigned'){seatRef.current=msg.seat;setSeat(msg.seat);setSt('waiting');}
        if(msg.type==='rejected'){setSt('error');setErr(msg.reason||'Could not join.');try{peer.destroy();}catch(e){};}
        if(msg.type==='lobby'){setLobby(msg.players||[]);}
        if(msg.type==='game_start'){
          onJoined({code:code.trim().toUpperCase(),pRef,connRef,isHost:false,myName:name.trim(),mySeat:seatRef.current??1,gameType:msg.gameType,playerNames:msg.playerNames,numDecks:msg.numDecks||1});
        }
      });
      conn.on('error',()=>{clearTimeout(timeout);setSt('error');setErr('Connection error.');});
    });
    peer.on('error',()=>{setSt('error');setErr('Could not connect. Check the room code.');});
  };

  return(
    <div className="mbg" onClick={e=>{if(e.target===e.currentTarget&&st==='idle')onCancel();}}>
      <div className="modal">
        <div className="mtit">JOIN TABLE</div>
        <div className="msub">Enter the code from your host</div>
        {st==='waiting'?(
          <>
            <div className="sbar ok"><div className="dot g"/>Joined seat {(seat??0)+1} — waiting for host</div>
            <div className="slots-wrap">
              {lobby.map((p,i)=>(
                <div key={i} className={`pslot ${p.status==='host'||p.status==='joined'?'filled':'empty'}`}>
                  <span className="slot-ava">{p.seat===0?PAVA:BOT_AVA[Math.min(p.seat-1,8)]}</span>
                  <span className="slot-nm">{p.name}</span>
                  <span className={`slot-tag ${p.status}`}>{p.status==='host'?'HOST':p.status==='joined'?'JOINED':'OPEN'}</span>
                </div>
              ))}
            </div>
            <div style={{textAlign:'center',fontSize:12,color:'rgba(244,239,229,.38)',fontStyle:'italic',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <div className="loader"/>Waiting for host to start…
            </div>
          </>
        ):(
          <>
            {err&&<div className="errmsg">{err}</div>}
            <div className="field"><label>Your Name</label>
              <input className="finp" placeholder="Enter your name…" value={name} onChange={e=>setName(e.target.value)} maxLength={20} autoFocus disabled={st==='connecting'}/>
            </div>
            <div className="field"><label>Room Code</label>
              <input className="finp" placeholder="e.g. XK7P2Q" value={code} onChange={e=>setCode(e.target.value.toUpperCase())} maxLength={6} style={{textTransform:'uppercase',letterSpacing:5,fontSize:20,textAlign:'center'}} disabled={st==='connecting'} onKeyDown={e=>e.key==='Enter'&&doJoin()}/>
            </div>
            <button className="mbtn" disabled={st==='connecting'||!name.trim()||code.trim().length<4} onClick={doJoin}>
              {st==='connecting'?<span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><div className="loader"/>Connecting…</span>:'Join Room →'}
            </button>
            <button className="mbtn sec" onClick={onCancel} disabled={st==='connecting'}>Cancel</button>
          </>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   KACHUFUL — REDUCER STATE MACHINE
══════════════════════════════════════ */
function buildRound(r,scores,dl,numPlayers,numDecks){
  const deck=shuffle(makeDecks(numDecks));
  const hands=Array.from({length:numPlayers},()=>[]);
  const cardsPerPlayer=r;
  for(let i=0;i<cardsPerPlayer;i++) for(let p=0;p<numPlayers;p++) hands[p].push(deck[i*numPlayers+p]);
  const trump=SUITS[0|Math.random()*4];
  const bidOrder=[];
  for(let i=1;i<=numPlayers;i++) bidOrder.push((dl+i)%numPlayers);
  return{
    phase:'bidding', round:r, scores:[...scores],
    hands, bids:Array(numPlayers).fill(null), won:Array(numPlayers).fill(0),
    trump, trick:[], cur:bidOrder[0], dealer:dl,
    bidOrder, bidIdx:0, trickWinnerSeat:null, roundResults:null,
    numPlayers, numDecks,
  };
}

function kachuReducer(state,action){
  const np=state.numPlayers||4;
  const nd=state.numDecks||1;
  switch(action.type){
    case 'START_ROUND':{
      const s=buildRound(action.round,action.scores,action.dealer,action.numPlayers,action.numDecks);
      return{...s,gameLog:state.gameLog||[]};
    }
    case 'BOT_BID':{
      const nb=[...state.bids];nb[action.seat]=action.bid;
      const ni=state.bidIdx+1;
      if(ni>=state.bidOrder.length) return{...state,bids:nb,bidIdx:ni,phase:'playing',cur:(state.dealer+1)%np};
      return{...state,bids:nb,bidIdx:ni,cur:state.bidOrder[ni]};
    }
    case 'PLAYER_BID':{
      const nb=[...state.bids];nb[action.seat]=action.bid;
      const ni=state.bidIdx+1;
      if(ni>=state.bidOrder.length) return{...state,bids:nb,bidIdx:ni,phase:'playing',cur:(state.dealer+1)%np};
      return{...state,bids:nb,bidIdx:ni,cur:state.bidOrder[ni]};
    }
    case 'PLAY_CARD':{
      const{seat,card}=action;
      const nh=state.hands.map(h=>[...h]);
      nh[seat]=nh[seat].filter(c=>c.id!==card.id);
      const nt=[...state.trick,{player:seat,card}];
      if(nt.length<np) return{...state,hands:nh,trick:nt,cur:(seat+1)%np};
      // Trick complete
      const w=trickW(nt,state.trump);
      const nw=[...state.won];nw[w]++;
      const roundOver=nh.every(h=>h.length===0);
      if(roundOver){
        const ns=[...state.scores];const res=[];
        for(let p=0;p<np;p++){
          const bid=state.bids[p]??0,got=nw[p],earned=got===bid?10+bid:0;
          ns[p]+=earned;res.push({player:p,bid,got,earned,trump:state.trump});
        }
        return{...state,hands:nh,trick:nt,won:nw,trickWinnerSeat:w,scores:ns,roundResults:res,phase:'showTrick'};
      }
      return{...state,hands:nh,trick:nt,won:nw,trickWinnerSeat:w,phase:'showTrick'};
    }
    case 'CLEAR_TRICK':{
      const over=state.roundResults!==null;
      if(over) return{...state,trick:[],trickWinnerSeat:null,phase:'roundEnd'};
      return{...state,trick:[],trickWinnerSeat:null,phase:'playing',cur:state.trickWinnerSeat};
    }
    case 'NEXT_ROUND':{
      const nd2=(state.dealer+1)%np;
      const maxR=maxRounds(np,nd);
      if(state.round>=maxR) return{...state,phase:'gameOver'};
      const s=buildRound(state.round+1,state.scores,nd2,np,nd);
      return{...s,gameLog:state.gameLog};
    }
    case 'ADD_LOG':{
      const l=[action.msg,...(state.gameLog||[])].slice(0,150);
      return{...state,gameLog:l};
    }
    default: return state;
  }
}

const K_INIT={phase:'start',round:1,scores:[0,0,0,0],hands:[[],[],[],[]],bids:[null,null,null,null],won:[0,0,0,0],trump:'',trick:[],cur:0,dealer:3,bidOrder:[],bidIdx:0,trickWinnerSeat:null,roundResults:null,gameLog:[],numPlayers:4,numDecks:1};

function KachufulGame({onLobby,multiCfg}){
  const isSolo=!multiCfg;
  const mySeat=multiCfg?.mySeat??0;
  const cfgNumP=multiCfg?.numPlayers??4;
  const cfgNumD=multiCfg?.numDecks??1;
  const playerNames=useMemo(()=>multiCfg?.playerNames||['You',...BOT_NAMES],[multiCfg]);
  const getName=useCallback(i=>i===mySeat?'You':(playerNames[i]||BOT_NAMES[Math.max(0,i-1)]),[playerNames,mySeat]);
  const isBot=useCallback(seat=>{
    if(isSolo)return seat!==mySeat;
    const real=new Set(Object.keys(multiCfg?.connsRef?.current||{}).map(Number));real.add(0);
    return !real.has(seat);
  },[isSolo,multiCfg,mySeat]);

  const[G,dispatch]=useReducer(kachuReducer,K_INIT);
  const[invalid,setInvalid]=useState(null);
  const[dealAnim,setDealAnim]=useState(false);
  const{toast,ToastUI}=useToast();
  const log=useCallback(msg=>{toast(msg);dispatch({type:'ADD_LOG',msg});},[toast]);

  const NP=G.numPlayers||cfgNumP;
  const ND=G.numDecks||cfgNumD;
  const MAX_R=maxRounds(NP,ND);

  // Restricted bid (dealer rule)
  const restricted=useMemo(()=>{
    if(G.phase!=='bidding')return null;
    const mi=G.bidOrder.indexOf(mySeat);if(mi!==G.bidOrder.length-1)return null;
    const sum=G.bids.reduce((a,b,i)=>i===mySeat?a:a+(b??0),0);
    const r=G.round-sum;return(r>=0&&r<=G.round)?r:null;
  },[G.phase,G.bidOrder,G.bids,G.round,mySeat]);

  // BOT BIDDING
  useEffect(()=>{
    if(G.phase!=='bidding')return;
    const bidder=G.bidOrder[G.bidIdx];
    if(bidder===undefined||bidder===mySeat||!isBot(bidder))return;
    const t=setTimeout(()=>{
      const sum=G.bids.reduce((a,b)=>a+(b??0),0);
      const isLast=G.bidIdx===G.bidOrder.length-1;
      let bid=0|Math.random()*(G.round+1);
      if(isLast){let tries=0;while(sum+bid===G.round&&tries<30){bid=0|Math.random()*(G.round+1);tries++;}}
      log(`${getName(bidder)} bids ${bid}`);
      dispatch({type:'BOT_BID',seat:bidder,bid});
    },700);
    return()=>clearTimeout(t);
  },[G.phase,G.bidIdx,G.bidOrder,G.bids,G.round,mySeat,isBot,getName,log]);

  // BOT PLAYING
  useEffect(()=>{
    if(G.phase!=='playing')return;
    if(G.cur===mySeat||!isBot(G.cur))return;
    const t=setTimeout(()=>{
      const hand=G.hands[G.cur];
      if(!hand||!hand.length)return;
      const lead=G.trick.length>0?G.trick[0].card.suit:null;
      const card=botCard(hand,lead,G.trump);
      log(`${getName(G.cur)} played ${card.value}${card.suit}`);
      dispatch({type:'PLAY_CARD',seat:G.cur,card});
    },1200);
    return()=>clearTimeout(t);
  },[G.phase,G.cur,G.hands,G.trick,G.trump,mySeat,isBot,getName,log]);

  // SHOW TRICK → CLEAR
  useEffect(()=>{
    if(G.phase!=='showTrick'||G.trickWinnerSeat===null)return;
    const isRoundEnd=G.roundResults!==null;
    log(`${getName(G.trickWinnerSeat)} won the trick!${isRoundEnd?' Round over!':''}`);
    const t=setTimeout(()=>dispatch({type:'CLEAR_TRICK'}),1400);
    return()=>clearTimeout(t);
  },[G.phase,G.trickWinnerSeat,G.roundResults,getName,log]);

  // Deal animation trigger
  useEffect(()=>{
    if(G.phase==='bidding'&&G.bidIdx===0){setDealAnim(true);const t=setTimeout(()=>setDealAnim(false),700);return()=>clearTimeout(t);}
  },[G.round,G.phase]);

  // Log new round
  useEffect(()=>{
    if(G.phase==='bidding'&&G.bidIdx===0&&G.trump)
      log(`Round ${G.round}/${MAX_R} — Trump: ${G.trump} ${SNAMES[G.trump]}`);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[G.round]);

  const startGame=useCallback(()=>{
    dispatch({type:'START_ROUND',round:1,scores:Array(cfgNumP).fill(0),dealer:cfgNumP>1?cfgNumP-1:0,numPlayers:cfgNumP,numDecks:cfgNumD});
  },[cfgNumP,cfgNumD]);

  const doBid=useCallback(b=>{
    if(G.phase!=='bidding'||G.bidOrder[G.bidIdx]!==mySeat)return;
    log(`You bid ${b}`);dispatch({type:'PLAYER_BID',seat:mySeat,bid:b});
  },[G.phase,G.bidOrder,G.bidIdx,mySeat,log]);

  const playCard=useCallback(card=>{
    if(G.phase!=='playing'||G.cur!==mySeat)return;
    const lead=G.trick.length>0?G.trick[0].card.suit:null;
    if(lead&&card.suit!==lead&&G.hands[mySeat].some(c=>c.suit===lead)){
      setInvalid(card.id);setTimeout(()=>setInvalid(null),430);
      toast(`Must follow ${SNAMES[lead]}!`);return;
    }
    log(`You played ${card.value}${card.suit}`);
    dispatch({type:'PLAY_CARD',seat:mySeat,card});
  },[G.phase,G.cur,G.trick,G.hands,mySeat,toast,log]);

  const doNextRound=useCallback(()=>dispatch({type:'NEXT_ROUND'}),[]);
  const doRestart=useCallback(()=>dispatch({type:'START_ROUND',round:1,scores:Array(cfgNumP).fill(0),dealer:cfgNumP>1?cfgNumP-1:0,numPlayers:cfgNumP,numDecks:cfgNumD}),[cfgNumP,cfgNumD]);

  const lead=G.trick.length>0?G.trick[0].card.suit:null;
  const hasLead=lead&&G.hands[mySeat]?.some(c=>c.suit===lead);
  const isMyBid=G.phase==='bidding'&&G.bidOrder[G.bidIdx]===mySeat;
  const botBidWait=G.phase==='bidding'&&G.bidOrder[G.bidIdx]!==mySeat;
  const fSorted=useMemo(()=>[...G.scores.map((s,i)=>({s,i}))].sort((a,b)=>b.s-a.s),[G.scores]);
  const medals=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];
  const opponents=[...Array(NP).keys()].filter(p=>p!==mySeat);

  return(
    <HostGate allHands={G.hands} scores={G.scores} bids={G.bids} won={G.won} trump={G.trump} round={G.round} gameLog={G.gameLog} trick={G.trick} p2sets={null} sets={null} gameType="kachuful" getName={getName} numPlayers={NP} numDecks={ND}>
    <div className="gshell">
      <ToastUI/>
      {G.phase==='start'&&<StartScreen title="KACHUFUL" icon="🃏"
        sub={`Oh Hell · ${MAX_R} Rounds · ${NP} Players · ${ND} Deck${ND>1?'s':''}`}
        features={[`${MAX_R} Rounds`,`${NP} Players`,`${ND} Deck${ND>1?'s':''}`,`${ND*52} Cards`,'Bid Exactly','Follow Suit','Trump Rules']}
        desc={<>Predict exactly how many tricks you'll win each round.<br/><strong style={{color:'#81c784'}}>Match → 10 + bid pts.</strong> <strong style={{color:'#e57373'}}>Miss → 0 pts.</strong></>}
        onStart={startGame}/>}
      {G.phase==='roundEnd'&&G.roundResults&&<RoundEndScr round={G.round} maxR={MAX_R} results={G.roundResults} scores={G.scores} onNext={doNextRound} getName={getName}/>}
      {G.phase==='gameOver'&&<GameOverScr
        sub={fSorted[0].i===mySeat?'🎉 You Win!':getName(fSorted[0].i)+' Wins!'}
        rows={fSorted.map(({s,i},r)=>(
          <div key={i} className={`rrow ${r===0?'hit':'miss'}`}>
            <span style={{fontSize:16}}>{medals[r]}</span><span style={{fontSize:16}}>{i===0?PAVA:BOT_AVA[i-1]}</span>
            <span className="rn">{getName(i)}</span>
            <span className={`re ${r===0?'pos':'neg'}`} style={{fontSize:14}}>{s}</span>
          </div>
        ))}
        onRestart={doRestart} onLobby={onLobby}/>}

      <div className="topbar">
        <button className="bkbtn" onClick={onLobby}>← Lobby</button>
        <span className="tbtit">KACHUFUL</span>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <span className="pill">Rd <strong>{G.round}/{MAX_R}</strong></span>
          {G.trump&&<span className="trump-b" style={{color:isRed(G.trump)?'#ff7070':'#e0e0e0'}}>{G.trump} <span style={{fontSize:10,fontWeight:400}}>{SNAMES[G.trump]}</span></span>}
          <span className="info-tag">{NP}P {ND}🃏</span>
          {!isSolo&&<span className="onbadge"><div className="dot g"/>LIVE</span>}
        </div>
        <div className="scbar">
          {G.scores.map((s,i)=><div key={i} className="scc"><div className="scn">{i===mySeat?'YOU':getName(i).slice(0,3).toUpperCase()}</div><div className="scp">{s}</div></div>)}
        </div>
      </div>

      {/* OPPONENTS GRID — wraps for many players */}
      <div className="opp-grid">
        {opponents.map(p=>(
          <div key={p} className={`bp${G.cur===p?' active':''}`}>
            {G.dealer===p&&<span className="dlbl">D</span>}
            <div className="bava">{BOT_AVA[Math.max(0,p-1)]}</div>
            <div className="bnm">{getName(p)}</div>
            <div className="bsts">
              <span className="chip">Bid <b>{G.bids[p]!==null?G.bids[p]:'?'}</b></span>
              <span className="chip">Won <b>{G.won[p]}</b></span>
            </div>
            {/* Single face-down card — shows they have cards, reveals nothing else */}
            <div className="bcds">
              {(G.hands[p]||[]).length>0 && <CardBack w={26} h={38}/>}
            </div>
          </div>
        ))}
      </div>

      {/* TABLE */}
      <div className="tarea">
        <div className="psurf">
          {G.trick.length===0&&<span className="tmsg">{G.phase==='bidding'?'Awaiting bids…':G.phase==='playing'?'Lead the trick':''}</span>}
          {G.trick.map(({player,card},i)=>(
            <div key={card.id} className="pcw">
              <span className="pcw-lbl">{getName(player)}</span>
              <CF card={card} play cls={G.trickWinnerSeat===player&&G.phase==='showTrick'?'winhl awp':''}/>
              {i===0&&<span style={{fontSize:8,background:'rgba(201,168,76,.18)',color:'var(--gl)',border:'1px solid rgba(201,168,76,.28)',borderRadius:4,padding:'1px 4px'}}>Lead</span>}
            </div>
          ))}
        </div>
      </div>

      {/* PLAYER */}
      <div className="parea">
        <div className="pbar">
          <div className="pid">
            <span className="pava">{PAVA}</span>
            <div>
              <div className="pnm">{getName(mySeat)}{G.dealer===mySeat&&<span style={{fontSize:9,color:'var(--gold)',marginLeft:4}}>DEALER</span>}</div>
              <div style={{display:'flex',gap:5,marginTop:2}}>
                <span className="chip">Bid <b>{G.bids[mySeat]??'?'}</b></span>
                <span className="chip">Won <b>{G.won[mySeat]}</b></span>
                <span className="chip">Cards <b>{G.hands[mySeat]?.length||0}</b></span>
              </div>
            </div>
          </div>
          {G.cur===mySeat&&G.phase==='playing'&&<span className="turn-b">✦ Your Turn</span>}
        </div>

        {isMyBid&&(
          <div className="bidpnl">
            <div className="bidpr">
              Choose bid (0–{G.round})
              {restricted!==null&&<> — <span className="nobd">cannot bid {restricted}</span> (dealer rule)</>}
            </div>
            <div className="bidbtns">
              {Array.from({length:G.round+1},(_,i)=>i).map(b=>(
                <button key={b} className="bidb" disabled={b===restricted} onClick={()=>doBid(b)}>{b}</button>
              ))}
            </div>
          </div>
        )}
        {botBidWait&&<div className="bidpnl"><div className="bwait">⏳ {getName(G.bidOrder[G.bidIdx])} is thinking…</div></div>}

        <div className="hwrap">
          {(G.hands[mySeat]||[]).map((card,i)=>{
            const tot=G.hands[mySeat]?.length||0;
            const sp=Math.min(38,300/Math.max(tot,1));
            const off=i-(tot-1)/2;
            const rot=off*(tot>7?1.5:tot>4?2:2.8);
            const ys=Math.abs(off)*1.3;
            const canPlay=G.phase==='playing'&&G.cur===mySeat;
            const inv=invalid===card.id;
            const unp=canPlay&&hasLead&&card.suit!==lead;
            return(
              <div key={card.id} style={{position:'relative',flexShrink:0,transform:`translateX(${off*sp}px) translateY(${ys}px) rotate(${rot}deg)`,zIndex:i,marginLeft:i===0?0:-32,transition:'transform .2s ease'}}>
                <CF card={card} deal={dealAnim} style={{animationDelay:dealAnim?`${i*.04}s`:'0s'}}
                  cls={[inv?'ashk':'',!canPlay?'noturn':unp?'unplayable':'playable'].filter(Boolean).join(' ')}
                  onClick={()=>canPlay&&!unp&&playCard(card)}/>
              </div>
            );
          })}
          {!G.hands[mySeat]?.length&&G.phase==='playing'&&<span style={{color:'rgba(244,239,229,.22)',fontSize:12,fontStyle:'italic'}}>No cards left</span>}
        </div>
      </div>
    </div>
    </HostGate>
  );
}

/* ══════════════════════════════════════
   NAPOLEON GAME
══════════════════════════════════════ */
function NapoleonGame({onLobby,multiCfg}){
  const isSolo=!multiCfg;
  const mySeat=multiCfg?.mySeat??0;
  const cfgNumP=multiCfg?.numPlayers??4;
  const cfgNumD=multiCfg?.numDecks??1;
  const playerNames=useMemo(()=>multiCfg?.playerNames||['You',...BOT_NAMES],[multiCfg]);
  const getName=useCallback(i=>i===mySeat?'You':(playerNames[i]||BOT_NAMES[Math.max(0,i-1)]),[playerNames,mySeat]);

  const[phase,setPhase]=useState('start');
  const[numP,setNumP]=useState(cfgNumP);
  const[numD,setNumD]=useState(cfgNumD);
  const[hands,setHands]=useState(Array.from({length:cfgNumP},()=>[]));
  const[sets,setSets]=useState(Array.from({length:cfgNumP},()=>[]));
  const[p2sets,setP2sets]=useState(Array.from({length:cfgNumP},()=>[]));
  const[cur,setCur]=useState(mySeat);
  const[firstEmpty,setFE]=useState(-1);
  const[askWho,setAskWho]=useState('');
  const[askWhat,setAskWhat]=useState('');
  const[p2Who,setP2Who]=useState('');
  const[p2What,setP2What]=useState('');
  const[nahPop,setNahPop]=useState(null);
  const[log,setLog]=useState([]);
  const[gameLog,setGameLog]=useState([]);
  const[dealAnim,setDealAnim]=useState(false);
  const[winner,setWinner]=useState(null);
  const busy=useRef(false);
  const{toast,ToastUI}=useToast();

  const totalSets=13; // always 13 ranks regardless of decks

  const addLog=useCallback(msg=>{setLog(p=>[msg,...p].slice(0,50));setGameLog(p=>[msg,...p].slice(0,200));toast(msg);},[toast]);
  const showNah=useCallback((a,b,w)=>{setNahPop({a,b,w});setTimeout(()=>setNahPop(null),950);},[]);

  const doExtract=useCallback((hs,ss,nd)=>{
    const nh=hs.map(h=>[...h]);const ns=ss.map(s=>[...s]);
    for(let p=0;p<nh.length;p++){
      const{hand,extracted}=extractSets(nh[p],nd);
      if(extracted.length){nh[p]=hand;ns[p]=[...ns[p],...extracted];extracted.forEach(r=>addLog(`${getName(p)} completed a SET of ${r}s! 🎉`));}
    }
    return{hands:nh,sets:ns};
  },[addLog,getName]);

  const checkP2=useCallback((ns,fE,np)=>{
    if(ns.reduce((a,s)=>a+s.length,0)!==totalSets)return false;
    addLog('══ All 13 sets formed! Phase 2 begins! ══');
    const p2=ns.map(s=>s.map(r=>({rank:r})));
    setP2sets(p2);setSets(Array.from({length:np},()=>[]));setPhase('p2');
    const starter=fE>=0?fE:mySeat;setCur(starter);
    // Point dropdowns at first opponent who has sets
    const firstOppWithSets=[...Array(np).keys()].find(p=>p!==mySeat&&(p2[p]||[]).length>0);
    if(firstOppWithSets!==undefined){
      setP2Who(String(firstOppWithSets));
      setP2What((p2[firstOppWithSets]||[])[0]?.rank||'');
    }
    return true;
  },[addLog,mySeat,totalSets]);

  const nextWithCards=useCallback((from,hs)=>{
    const np=hs.length;
    for(let i=1;i<=np;i++){const n=(from+i)%np;if(hs[n].length>0)return n;}return from;
  },[]);

  const startGame=useCallback(()=>{
    busy.current=false;
    const np=cfgNumP,nd=cfgNumD;
    setNumP(np);setNumD(nd);
    const deck=shuffle(makeDecks(nd));
    const total=nd*52;
    const hs=Array.from({length:np},()=>[]);
    for(let i=0;i<total;i++) hs[i%np].push(deck[i]);
    const ss=Array.from({length:np},()=>[]);
    const{hands:h2,sets:s2}=doExtract(hs,ss,nd);
    h2[mySeat].sort((a,b)=>VORD[a.value]-VORD[b.value]);
    setHands(h2);setSets(s2);setP2sets(Array.from({length:np},()=>[]));setCur(mySeat);
    setFE(-1);setNahPop(null);setLog([]);setWinner(null);setGameLog([]);
    const r=holdsRanks(h2[mySeat]);setAskWhat(r[0]||'');
    const ow=[...Array(np).keys()].filter(p=>p!==mySeat&&h2[p].length>0);
    if(ow.length)setAskWho(String(ow[0]));
    setP2Who('');setP2What('');
    setDealAnim(true);setTimeout(()=>setDealAnim(false),600);setPhase('p1');
    addLog(`Cards dealt! ${Math.ceil(nd*52/np)}–${Math.floor(nd*52/np)} cards each.`);
  },[doExtract,mySeat,cfgNumP,cfgNumD,addLog]);

  const applyAsk=useCallback((asker,asked,rank,hs,ss,fE,nd,np)=>{
    const nh=hs.map(h=>[...h]);const ns=ss.map(s=>[...s]);
    const ac=nh[asked].filter(c=>c.value===rank);
    if(!ac.length){
      showNah(asker,asked,rank);
      addLog(`${getName(asker)} asked ${getName(asked)} for ${rank}s — 🏠 Not At Home!`);
      return{hands:nh,sets:ns,nextCur:asked,fE};
    }
    ac.forEach(c=>{const i=nh[asked].findIndex(x=>x.id===c.id);if(i>-1){nh[asked].splice(i,1);nh[asker].push(c);}});
    addLog(`${getName(asker)} got ${ac.length}× ${rank} from ${getName(asked)}!`);
    const{hands:eh,sets:es}=doExtract(nh,ns,nd);
    eh[mySeat].sort((a,b)=>VORD[a.value]-VORD[b.value]);
    let nfE=fE;
    if(eh[asker].length===0&&fE<0){nfE=asker;}
    return{hands:eh,sets:es,nextCur:asker,fE:nfE};
  },[showNah,addLog,doExtract,getName,mySeat]);

  const handleAsk=useCallback(()=>{
    if(cur!==mySeat||phase!=='p1'||busy.current)return;
    const asked=parseInt(askWho);const rank=askWhat;
    if(!rank||!holdsRanks(hands[mySeat]).includes(rank)){toast('Pick a rank you hold!');return;}
    if(!hands[asked]?.length){toast('That player has no cards!');return;}
    busy.current=true;
    const{hands:nh,sets:ns,nextCur,fE:nfE}=applyAsk(mySeat,asked,rank,hands,sets,firstEmpty,numD,numP);
    setHands(nh);setSets(ns);
    let fEU=firstEmpty;if(nfE!==firstEmpty){setFE(nfE);fEU=nfE;}
    if(!checkP2(ns,fEU,numP)){
      let nc=nextCur;if(nh[nc]?.length===0)nc=nextWithCards(nc,nh);
      const vr=holdsRanks(nh[mySeat]);setAskWhat(vr[0]||'');
      const wc=[...Array(numP).keys()].filter(p=>p!==mySeat&&nh[p]?.length>0);
      if(wc.length&&!wc.map(String).includes(askWho))setAskWho(String(wc[0]));
      setCur(nc);
    }
    busy.current=false;
  },[cur,mySeat,phase,askWho,askWhat,hands,sets,firstEmpty,numD,numP,applyAsk,checkP2,nextWithCards,toast]);

  // Bot P1
  useEffect(()=>{
    if(phase!=='p1'||cur===mySeat||busy.current)return;
    busy.current=true;
    const t=setTimeout(()=>{
      const mr=holdsRanks(hands[cur]||[]);
      if(!mr.length){setCur(nextWithCards(cur,hands));busy.current=false;return;}
      const rank=mr[0|Math.random()*mr.length];
      const opps=[...Array(numP).keys()].filter(p=>p!==cur&&hands[p]?.length>0);
      if(!opps.length){busy.current=false;return;}
      const asked=opps[0|Math.random()*opps.length];
      const{hands:nh,sets:ns,nextCur,fE:nfE}=applyAsk(cur,asked,rank,hands,sets,firstEmpty,numD,numP);
      setHands(nh);setSets(ns);
      let fEU=firstEmpty;if(nfE!==firstEmpty){setFE(nfE);fEU=nfE;}
      if(!checkP2(ns,fEU,numP)){
        let nc=nextCur;if(nh[nc]?.length===0)nc=nextWithCards(nc,nh);
        const vr=holdsRanks(nh[mySeat]||[]);setAskWhat(vr[0]||'');
        const wc=[...Array(numP).keys()].filter(p=>p!==mySeat&&nh[p]?.length>0);
        if(wc.length&&!wc.map(String).includes(askWho))setAskWho(String(wc[0]));
        setCur(nc);
      }
      busy.current=false;
    },1500);
    return()=>{clearTimeout(t);busy.current=false;};
  },[phase,cur,mySeat,hands,sets,firstEmpty,askWho,numD,numP,applyAsk,checkP2,nextWithCards]);

  const applyP2Ask=useCallback((asker,asked,rank,p2s,np)=>{
    const np2=p2s.map(s=>[...s]);
    const has=np2[asked].find(s=>s.rank===rank);
    if(!has){
      showNah(asker,asked,rank);
      toast(`${getName(asker)} asked ${getName(asked)} for ${rank}s — 🏠 Not At Home!`);
      return{p2sets:np2,nextCur:asked,won:false};
    }
    np2[asked]=np2[asked].filter(s=>s.rank!==rank);
    np2[asker]=[...np2[asker],{rank}];
    toast(`${getName(asker)} asked ${getName(asked)} for ${rank}s — ✓ Got it!`);
    if(np2[asker].length===totalSets){
      setWinner(asker);setPhase('gameover');
      toast(`🏆 ${getName(asker)} wins!`);
    }
    return{p2sets:np2,nextCur:asker,won:np2[asker].length===totalSets};
  },[showNah,toast,getName,totalSets]);

  // Helper: all ranks currently held by any opponent
  const ranksAvailableToAsk=useCallback((myS,p2s,np,exclude)=>{
    // Any rank that at least one opponent holds, that we don't already have all 13 of
    const iOwn=new Set((p2s[myS]||[]).map(s=>s.rank));
    return VALUES.filter(r=>{
      if(iOwn.has(r))return false; // already own it
      return [...Array(np).keys()].some(p=>p!==myS&&p!==exclude&&(p2s[p]||[]).some(s=>s.rank===r));
    });
  },[]);

  const handleP2Ask=useCallback(()=>{
    if(cur!==mySeat||phase!=='p2'||busy.current)return;
    const asked=parseInt(p2Who);const rank=p2What;
    if(!rank){toast('Pick a rank to ask for!');return;}
    if(isNaN(asked)||asked===mySeat){toast('Pick a player to ask!');return;}
    // The asked player must hold that set
    if(!(p2sets[asked]||[]).some(s=>s.rank===rank)){
      toast(`${getName(asked)} doesn't have the ${rank}s set — try another!`);return;
    }
    busy.current=true;
    const{p2sets:np2,nextCur,won}=applyP2Ask(mySeat,asked,rank,p2sets,numP);
    setP2sets(np2);
    if(!won){
      // Advance rank only — keep same player selected
      const allRanks=VALUES.slice().reverse(); // A down to 2
      const curIdx=allRanks.indexOf(rank);
      const nextRank=allRanks[(curIdx+1)%allRanks.length];
      setP2What(nextRank);
      // p2Who stays the same — player doesn't change
      setCur(nextCur);
    }
    busy.current=false;
  },[cur,mySeat,phase,p2Who,p2What,p2sets,numP,applyP2Ask,getName,toast,ranksAvailableToAsk]);

  // Bot P2 — bot picks any rank an opponent holds that it doesn't already own
  useEffect(()=>{
    if(phase!=='p2'||cur===mySeat||busy.current)return;
    busy.current=true;
    const t=setTimeout(()=>{
      // Ranks available for this bot to ask for
      const iOwn=new Set((p2sets[cur]||[]).map(s=>s.rank));
      const targets=[];
      [...Array(numP).keys()].forEach(p=>{
        if(p===cur)return;
        (p2sets[p]||[]).forEach(s=>{
          if(!iOwn.has(s.rank))targets.push({asked:p,rank:s.rank});
        });
      });
      if(!targets.length){
        // Bot has all available sets or nothing to ask — pass to next
        const next=[...Array(numP).keys()].find(p=>p!==cur&&(p2sets[p]||[]).length>0);
        if(next!==undefined)setCur(next);
        busy.current=false;return;
      }
      const{asked,rank}=targets[0|Math.random()*targets.length];
      const{p2sets:np2,nextCur,won}=applyP2Ask(cur,asked,rank,p2sets,numP);
      setP2sets(np2);
      if(!won){
        const available=ranksAvailableToAsk(mySeat,np2,numP,-1);
        setP2What(available[0]||'');
        const ow=[...Array(numP).keys()].filter(p=>p!==mySeat&&(np2[p]||[]).length>0);
        if(ow.length)setP2Who(String(ow[0]));
        setCur(nextCur);
      }
      busy.current=false;
    },1500);
    return()=>{clearTimeout(t);busy.current=false;};
  },[phase,cur,mySeat,p2sets,numP,applyP2Ask,ranksAvailableToAsk]);

  const myRanks=holdsRanks(hands[mySeat]||[]);
  const myP2Sets=p2sets[mySeat]||[];
  const isP1T=phase==='p1'&&cur===mySeat;
  const isP2T=phase==='p2'&&cur===mySeat;
  const bwc=[...Array(numP).keys()].filter(p=>p!==mySeat&&hands[p]?.length>0);
  const bws=[...Array(numP).keys()].filter(p=>p!==mySeat&&(p2sets[p]||[]).length>0);
  const opponents=[...Array(numP).keys()].filter(p=>p!==mySeat);
  const totS=sets.reduce((a,s)=>a+s.length,0)+p2sets.reduce((a,s)=>a+s.length,0);

  // (Phase 2 dropdowns show all players and all 13 ranks freely — no pre-filtering)

  return(
    <HostGate allHands={hands} scores={Array(numP).fill(0)} bids={Array(numP).fill(null)} won={Array(numP).fill(0)} trump="" round={0} gameLog={gameLog} trick={[]} p2sets={p2sets} sets={sets} gameType="napoleon" getName={getName} numPlayers={numP} numDecks={numD}>
    <div className="gshell">
      <ToastUI/>
      {nahPop&&<div className="nahp"><div className="naht">🏠 Not At Home!</div><div className="nahs">{getName(nahPop.a)} asked {getName(nahPop.b)} for {nahPop.w}s</div></div>}

      {phase==='start'&&<StartScreen title="NAPOLEON" icon="♟️"
        sub={`Ghar Ma Nathi · ${cfgNumP} Players · ${cfgNumD} Deck${cfgNumD>1?'s':''}`}
        features={[`${cfgNumP} Players`,`${cfgNumD} Deck${cfgNumD>1?'s':''}`,`${cfgNumD*52} Cards`,'Ask & Collect','Two Phases','13 Sets']}
        desc={<>Ask opponents for ranks you hold. Complete sets of {4*cfgNumD} of a rank.<br/>In Phase 2, race to collect all 13 sets to win!</>}
        onStart={startGame}/>}

      {phase==='gameover'&&<GameOverScr
        sub={winner===mySeat?'🎉 You collected all 13 sets!':getName(winner)+' wins!'}
        rows={[...Array(numP).keys()].map(p=>(
          <div key={p} className={`rrow ${p===winner?'hit':'miss'}`}>
            <span style={{fontSize:16}}>{p===0?PAVA:BOT_AVA[p-1]}</span>
            <span className="rn">{getName(p)}</span>
            <span className="rd">{p2sets[p]?.length||0} sets</span>
            <span className={`re ${p===winner?'pos':'neg'}`}>{p===winner?'👑 WIN':'—'}</span>
          </div>
        ))}
        onRestart={startGame} onLobby={onLobby}/>}

      <div className="topbar">
        <button className="bkbtn" onClick={onLobby}>← Lobby</button>
        <span className="tbtit">NAPOLEON</span>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <span className="pill"><strong style={{color:'var(--gl)'}}>{phase==='p1'?'Phase 1':'Phase 2'}</strong></span>
          {phase==='p1'&&<span className="pill">Sets <strong>{totS}/{totalSets}</strong></span>}
          <span className="info-tag">{numP}P {numD}🃏</span>
          {!isSolo&&<span className="onbadge"><div className="dot g"/>LIVE</span>}
        </div>
        <div className="scbar">
          {[...Array(numP).keys()].map(p=>(
            <div key={p} className="scc">
              <div className="scn">{p===mySeat?'YOU':getName(p).slice(0,3).toUpperCase()}</div>
              
              <div className="scp">{phase==='p1'?(p===mySeat?(sets[mySeat]||[]).length||0:'?'):'?'}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="phbar">
        <div className={`phstep${phase==='p1'?' on':''}`}>PHASE 1 — COLLECT RANKS</div>
        <div className={`phstep${phase==='p2'?' on':''}`}>PHASE 2 — COLLECT SETS</div>
      </div>

      {/* ── PHASE 1: opponent panels ── */}
      {phase==='p1'&&(
        <div className="opp-grid">
          {opponents.map(p=>(
            <div key={p} className={`bp${cur===p?' active':''}`}>
              <div className="bava">{BOT_AVA[Math.max(0,p-1)]}</div>
              <div className="bnm">{getName(p)}</div>
              {/* No card backs, no count — hand is completely private */}
            </div>
          ))}
        </div>
      )}

      {/* ── PHASE 2: simple centre area ── */}
      {phase==='p2'&&(
        <div className="tarea">
          <div className="psurf" style={{flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,minHeight:120,padding:'18px 20px'}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:'rgba(244,239,229,.35)',letterSpacing:2,textTransform:'uppercase'}}>Phase 2 — Collect Sets</div>
            <div style={{fontSize:13,color:'rgba(244,239,229,.5)',textAlign:'center',lineHeight:1.7}}>
              Ask any player for any rank.<br/>
              <span style={{color:'rgba(244,239,229,.28)',fontSize:11}}>Result shown once as notification — then gone.</span>
            </div>
            {cur!==mySeat&&(
              <div style={{marginTop:4,fontSize:13,color:'var(--gl)',fontStyle:'italic'}}>
                ⏳ {getName(cur)}'s turn…
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── PHASE 1: game log ── */}
      {phase==='p1'&&(
        <div className="tarea" style={{padding:'4px 12px'}}>
          <div className="psurf" style={{flexDirection:'column',alignItems:'stretch',minHeight:78,padding:'8px 12px',gap:0}}>
            {log.length===0&&<span className="tmsg">Game log…</span>}
            <div className="logbox" style={{maxHeight:84}}>{log.map((l,i)=><div key={i} className="loge">{l}</div>)}</div>
          </div>
        </div>
      )}

      <div className="parea">
        <div className="pbar">
          <div className="pid"><span className="pava">{PAVA}</span>
            <div>
              <div className="pnm">{getName(mySeat)}</div>
              <div style={{display:'flex',gap:5,marginTop:2}}>
                {phase==='p1'&&<span className="chip">Cards <b>{hands[mySeat]?.length||0}</b></span>}
              </div>
            </div>
          </div>
          {(isP1T||isP2T)&&<span className="turn-b">✦ Your Turn</span>}
          {!isP1T&&!isP2T&&phase!=='start'&&phase!=='gameover'&&<span style={{fontSize:11,color:'rgba(244,239,229,.38)',fontStyle:'italic'}}>⏳ {getName(cur)}'s turn…</span>}
        </div>

        {phase==='p1'&&sets[mySeat]?.length>0&&(
          <div style={{marginBottom:5}}>
            <div style={{fontSize:9,color:'rgba(244,239,229,.3)',letterSpacing:.5,marginBottom:3,textTransform:'uppercase'}}>Your sets</div>
            <div className="setsrow">{sets[mySeat].map(r=><span key={r} className="stok">{r}s</span>)}</div>
          </div>
        )}

        {isP1T&&(
          <div className="napask">
            <div style={{fontSize:9,color:'rgba(244,239,229,.32)',letterSpacing:.5,marginBottom:7,textTransform:'uppercase'}}>
              Ask for a rank {numD>1&&<span style={{color:'var(--gl)'}}>· need {4*numD} to complete a set</span>}
            </div>
            <div className="askrow">
              <div className="askcol"><span className="asklbl">Ask who?</span>
                <select className="asksel" value={askWho} onChange={e=>setAskWho(e.target.value)}>
                  {bwc.length===0&&<option value="">No opponents</option>}
                  {bwc.map(p=><option key={p} value={p}>{getName(p)}</option>)}
                </select>
              </div>
              <div className="askcol"><span className="asklbl">For what rank?</span>
                <select className="asksel" value={askWhat} onChange={e=>setAskWhat(e.target.value)}>
                  {myRanks.length===0&&<option value="">No ranks</option>}
                  {myRanks.map(r=><option key={r} value={r}>{r}s ({(hands[mySeat]||[]).filter(c=>c.value===r).length}/{4*numD})</option>)}
                </select>
              </div>
              <button className="askbtn" onClick={handleAsk} disabled={!askWhat||!myRanks.length||!bwc.length}>Ask!</button>
            </div>
          </div>
        )}
        {phase==='p1'&&!isP1T&&cur!==mySeat&&<div className="napask" style={{padding:'7px 12px'}}><div className="bwait">⏳ {getName(cur)} is thinking…</div></div>}

        {isP2T&&(
          <div className="napask p2">
            <div className="phlbl">PHASE 2</div>
            <div className="askrow">
              <div className="askcol"><span className="asklbl">Ask who?</span>
                <select className="asksel" value={p2Who} onChange={e=>setP2Who(e.target.value)}>
                  <option value="">— player —</option>
                  {[...Array(numP).keys()].filter(p=>p!==mySeat).map(p=>(
                    <option key={p} value={p}>{getName(p)}</option>
                  ))}
                </select>
              </div>
              <div className="askcol"><span className="asklbl">For what rank?</span>
                <select className="asksel" value={p2What} onChange={e=>setP2What(e.target.value)}>
                  <option value="">— rank —</option>
                  {VALUES.slice().reverse().map(r=>(
                    <option key={r} value={r}>{r}s</option>
                  ))}
                </select>
              </div>
              <button className="askbtn" onClick={handleP2Ask} disabled={!p2What||!p2Who}>Ask!</button>
            </div>
          </div>
        )}
        {phase==='p2'&&!isP2T&&cur!==mySeat&&(
          <div className="napask p2" style={{padding:'7px 12px'}}>
            <div className="bwait">⏳ {getName(cur)} is deciding…</div>
          </div>
        )}

        {phase==='p1'&&(
          <div className="hwrap" style={{minHeight:92}}>
            {(hands[mySeat]||[]).map((card,i)=>{
              const tot=hands[mySeat]?.length||0;
              const sp=Math.min(34,280/Math.max(tot,1));
              const off=i-(tot-1)/2;const rot=off*(tot>9?1.2:tot>6?1.8:2.2);const ys=Math.abs(off)*1;
              return(
                <div key={card.id} style={{position:'relative',flexShrink:0,transform:`translateX(${off*sp}px) translateY(${ys}px) rotate(${rot}deg)`,zIndex:i,marginLeft:i===0?0:-26,transition:'transform .2s ease'}}>
                  <CF card={card} deal={dealAnim} style={{animationDelay:dealAnim?`${i*.03}s`:'0s',cursor:'default'}} cls="noturn"/>
                </div>
              );
            })}
            {!hands[mySeat]?.length&&<span style={{color:'rgba(244,239,229,.25)',fontSize:12,fontStyle:'italic'}}>Hand empty</span>}
          </div>
        )}
        {phase==='p2'&&<div style={{padding:'4px 0',textAlign:'center',fontSize:11,color:'rgba(244,239,229,.22)',fontStyle:'italic'}}>All cards are now sets. Use your instinct.</div>}
      </div>
    </div>
    </HostGate>
  );
}

/* ══════════════════════════════════════
   LOBBY
══════════════════════════════════════ */
const GAMES=[
  {id:'kachuful',ico:'🃏',tag:'Trick-Taking',tit:'Kachuful',ali:'Oh Hell',
   dsc:"Bid exactly how many tricks you'll win. Rounds scale with deck count and player count. Trump changes every round.",
   meta:['2–10 Players','1–3 Decks','Bidding','Follow Suit','Multiplayer ✓']},
  {id:'napoleon',ico:'♟️',tag:'Set Collection',tit:'Napoleon',ali:'Ghar Ma Nathi',
   dsc:'Ask opponents for ranks you hold to complete sets. With multiple decks, you need more cards per set. Classic Gujarati game.',
   meta:['2–10 Players','1–3 Decks','Ask & Collect','Two Phases','Multiplayer ✓']},
  {id:'c1',ico:'🎴',tag:'Coming Soon',tit:'Teen Patti',ali:'3-Card Brag',
   dsc:'The classic South Asian poker variant. Blind, seen, and side-show your way to the pot.',meta:['Up to 10 Players','Coming Soon'],soon:true},
  {id:'c2',ico:'🀄',tag:'Coming Soon',tit:'Rummy',ali:'Indian Rummy / Gin',
   dsc:'Meld sets and sequences. Draw, discard, and declare when your hand is ready.',meta:['2–6 Players','Coming Soon'],soon:true},
];

function Lobby({onPlay,onMulti}){
  return(
    <div className="lobby">
      <div className="lhdr">
        <div className="eyb">The Card Room</div>
        <div className="ltit">Play <span>Cards</span></div>
        <div className="lsub">2–10 players · 1–3 decks · anywhere</div>
      </div>
      <div className="srow">{['♠','♥','♦','♣'].map(s=><span key={s} className="si" style={{color:isRed(s)?'#bf2318':'#f4efe5'}}>{s}</span>)}</div>
      <div className="mp-cta">
        <div className="mpcta-btn create" onClick={()=>onMulti('create')}>
          <span className="mpcta-ico">🏠</span><span className="mpcta-lbl">CREATE TABLE</span>
          <span className="mpcta-sub">Host · pick players & decks</span>
        </div>
        <div className="mpcta-btn join" onClick={()=>onMulti('join')}>
          <span className="mpcta-ico">🔗</span><span className="mpcta-lbl">JOIN TABLE</span>
          <span className="mpcta-sub">Enter a friend's room code</span>
        </div>
      </div>
      <div style={{width:'100%',maxWidth:780,marginBottom:16,textAlign:'center',animation:'fUp .5s .05s ease both'}}>
        <div style={{fontSize:10,color:'rgba(244,239,229,.24)',letterSpacing:1,textTransform:'uppercase'}}>Or play solo vs bots</div>
      </div>
      <div className="game-grid">
        {GAMES.map((g,idx)=>(
          <div key={g.id} className={`gc${g.soon?' soon-c':''}`}
            style={{animationDelay:`${idx*.09}s`,animation:'fUp .6s ease both'}}
            onClick={()=>!g.soon&&onPlay(g.id)}>
            {g.soon&&<span className="soon-b">Coming Soon</span>}
            <div className="gc-ico">{g.ico}</div>
            <div className="gc-tag">{g.tag}</div>
            <div className="gc-tit">{g.tit}</div>
            <div className="gc-ali">{g.ali}</div>
            <div className="gc-dsc">{g.dsc}</div>
            <div className="gc-met">{g.meta.map(m=><span key={m} className="mpill">{m}</span>)}</div>
            {!g.soon&&<button className="pbtn">Play Solo →</button>}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   APP ROOT
══════════════════════════════════════ */
function App(){
  const[screen,setScreen]=useState('lobby');
  const[multiCfg,setMultiCfg]=useState(null);
  const handleMultiStart=useCallback(cfg=>{setMultiCfg(cfg);setScreen(cfg.gameType);},[]);
  const goLobby=useCallback(()=>{setScreen('lobby');setMultiCfg(null);},[]);
  const playSolo=useCallback(id=>{setMultiCfg(null);setScreen(id);},[]);
  return(
    <>
      {screen==='lobby'    &&<Lobby onPlay={playSolo} onMulti={m=>setScreen(m)}/>}
      {screen==='create'   &&<CreateTable onStart={handleMultiStart} onCancel={goLobby}/>}
      {screen==='join'     &&<JoinTable onJoined={handleMultiStart} onCancel={goLobby}/>}
      {screen==='kachuful' &&<KachufulGame onLobby={goLobby} multiCfg={multiCfg}/>}
      {screen==='napoleon' &&<NapoleonGame onLobby={goLobby} multiCfg={multiCfg}/>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
